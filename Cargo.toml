[package]
name = "otoium"
version = "0.1.0"
edition = "2021"
description = "UTAU voicebank oto.ini editor with TUI waveform display"
authors = ["otoium contributors"]
license = "MIT"

[[bin]]
name = "otoium"
path = "src/main.rs"

[dependencies]
# TUI framework
ratatui = "0.26"
crossterm = "0.27"

# Audio decoding
hound = "3.5"           # WAV reading (MIT)
symphonia = { version = "0.5", features = ["wav", "mp3", "aac"] }  # multi-format (MPL-2.0)

# Audio playback
rodio = { version = "0.17", default-features = false, features = ["wav"] }  # Apache-2.0/MIT

# Signal processing / DSP
rustfft = "6.1"         # FFT for spectrum analysis (MIT)
ndarray = "0.15"        # N-dimensional arrays (MIT/Apache-2.0)

# Encoding
encoding_rs = "0.8"     # Shift-JIS / UTF-8 conversion (Apache-2.0/MIT)

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
anyhow = "1"
thiserror = "1"

# Logging
log = "0.4"
env_logger = "0.11"

# Utility
unicode-width = "0.1"   # correct terminal width for CJK chars
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

# Notes on dependencies and licenses:
# ratatui       - MIT
# crossterm     - MIT
# hound         - MIT
# symphonia     - MPL-2.0 (compatible with MIT projects, not copyleft for binary distribution)
# rodio         - MIT / Apache-2.0
# rustfft       - MIT
# ndarray       - MIT / Apache-2.0
# encoding_rs   - Apache-2.0 / MIT
# serde         - MIT / Apache-2.0
# anyhow        - MIT / Apache-2.0
# thiserror     - MIT / Apache-2.0
# unicode-width - MIT / Apache-2.0
# chrono        - MIT / Apache-2.0
